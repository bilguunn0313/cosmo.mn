name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://cosmo:cosmo@localhost:3306/cosmo_test
      TEST_DATABASE_URL: mysql://cosmo:cosmo@localhost:3306/cosmo_test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cosmo-root
          MYSQL_USER: cosmo
          MYSQL_PASSWORD: cosmo
          MYSQL_DATABASE: cosmo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ucosmo -pcosmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Lint api
        run: npm run lint -w apps/api

      - name: Unit tests (api)
        run: npm test -w apps/api

      - name: E2E tests (api)
        run: npm run test:e2e -w apps/api

      - name: Build api
        run: npm run build -w apps/api

      - name: Build web
        run: npm run build -w apps/web
