name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cosmo:cosmo@localhost:5432/cosmo_test
      TEST_DATABASE_URL: postgresql://cosmo:cosmo@localhost:5432/cosmo_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cosmo
          POSTGRES_PASSWORD: cosmo
          POSTGRES_DB: cosmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Lint web
        run: npm run lint -w apps/web

      - name: Lint api
        run: npm run lint -w apps/api

      - name: Unit tests (api)
        run: npm test -w apps/api

      - name: E2E tests (api)
        run: npm run test:e2e -w apps/api

      - name: Build api
        run: npm run build -w apps/api

      - name: Build web
        run: npm run build -w apps/web
